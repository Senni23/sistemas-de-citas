<h3 class="mb-4 text-gradient">Dashboard</h3>

<div class="row g-3" *ngIf="resumen">
  <div class="col-md-3">
    <div class="stat-card" style="--accent: #22d3ee;">
      <i class="bi bi-people stat-icon"></i>
      <div class="stat-value">{{ resumen.totalPacientes }}</div>
      <div class="stat-label">Pacientes registrados</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="stat-card" style="--accent: #34d399;">
      <i class="bi bi-heart-pulse stat-icon"></i>
      <div class="stat-value">{{ resumen.totalMedicos }}</div>
      <div class="stat-label">Medicos registrados</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="stat-card" style="--accent: #a855f7;">
      <i class="bi bi-calendar2-check stat-icon"></i>
      <div class="stat-value">{{ resumen.totalCitas }}</div>
      <div class="stat-label">Citas totales</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="stat-card" style="--accent: #fbbf24;">
      <i class="bi bi-clock-history stat-icon"></i>
      <div class="stat-value">{{ resumen.citasHoy }}</div>
      <div class="stat-label">Citas de hoy</div>
    </div>
  </div>
</div>
