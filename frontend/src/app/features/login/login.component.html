<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card shadow-sm" style="width: 350px;">
    <div class="card-body">
      <h4 class="card-title mb-3 text-center">Iniciar sesion</h4>

      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input class="form-control" [(ngModel)]="username" name="username" />
      </div>

      <div class="mb-3">
        <label class="form-label">Contrasena</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password" />
      </div>

      <div class="alert alert-danger py-1" *ngIf="error">{{ error }}</div>

      <button class="btn btn-primary w-100" (click)="ingresar()">Ingresar</button>

      <p class="text-muted mt-3 mb-0 text-center" style="font-size: 0.8rem;">
        Usuario de prueba: admin / 123456
      </p>
    </div>
  </div>
</div>
