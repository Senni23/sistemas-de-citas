<div class="auth-shell">
  <div class="card auth-card shadow-sm" style="width: 380px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <img src="assets/logo-medicenter.jpg" alt="MEDICENTER" style="height: 56px; width: auto; border-radius: 8px;" class="mb-2">
        <h4 class="card-title mb-1 text-gradient">Crea tu nueva contrasena</h4>
      </div>

      <div class="alert alert-success py-2" *ngIf="mensaje">{{ mensaje }} Redirigiendo al inicio de sesion...</div>

      <ng-container *ngIf="!mensaje">
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-shield-lock me-1"></i>Nueva contrasena</label>
          <div class="password-field">
            <input [type]="mostrarPassword ? 'text' : 'password'" class="form-control" [(ngModel)]="password" name="password" placeholder="Minimo 6 caracteres" />
            <button type="button" class="password-toggle" (click)="mostrarPassword = !mostrarPassword" [attr.aria-label]="mostrarPassword ? 'Ocultar contrasena' : 'Mostrar contrasena'">
              <i class="bi" [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirmar contrasena</label>
          <div class="password-field">
            <input [type]="mostrarConfirmarPassword ? 'text' : 'password'" class="form-control" [(ngModel)]="confirmarPassword" name="confirmarPassword" />
            <button type="button" class="password-toggle" (click)="mostrarConfirmarPassword = !mostrarConfirmarPassword" [attr.aria-label]="mostrarConfirmarPassword ? 'Ocultar contrasena' : 'Mostrar contrasena'">
              <i class="bi" [ngClass]="mostrarConfirmarPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <div class="alert alert-danger py-1" *ngIf="error">{{ error }}</div>

        <button class="btn btn-primary w-100" (click)="restablecer()" [disabled]="cargando || !token">
          <i class="bi bi-check-circle me-1"></i>{{ cargando ? 'Guardando...' : 'Guardar nueva contrasena' }}
        </button>
      </ng-container>

      <p class="text-center mt-3 mb-0" style="font-size: 0.9rem;">
        <a routerLink="/login" class="text-gradient" style="cursor: pointer; text-decoration: none; font-weight: 600;">Volver a iniciar sesion</a>
      </p>
    </div>
  </div>
</div>
