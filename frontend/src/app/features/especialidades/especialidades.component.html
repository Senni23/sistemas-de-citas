<h3 class="mb-4 text-gradient">Especialidades</h3>

<div class="row">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h5>{{ editando ? 'Editar' : 'Nueva' }} especialidad</h5>
        <div class="mb-2">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="formulario.nombre" name="nombre" />
        </div>
        <div class="mb-2">
          <label class="form-label">Descripcion</label>
          <textarea class="form-control" [(ngModel)]="formulario.descripcion" name="descripcion"></textarea>
        </div>
        <button class="btn btn-primary me-2" (click)="guardar()">Guardar</button>
        <button class="btn btn-secondary" (click)="cancelar()" *ngIf="editando">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="col-md-8">
    <table class="table table-striped bg-white">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Descripcion</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of especialidades">
          <td>{{ e.nombre }}</td>
          <td>{{ e.descripcion }}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" (click)="editar(e)">Editar</button>
            <button class="btn btn-sm btn-outline-danger" (click)="eliminar(e.id!)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
