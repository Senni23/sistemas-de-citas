<div class="auth-shell">
  <div class="card auth-card shadow-sm" style="width: 380px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <img src="assets/logo-medicenter.jpg" alt="MEDICENTER" style="height: 56px; width: auto; border-radius: 8px;" class="mb-2">
        <h4 class="card-title mb-1 text-gradient">Recupera tu contrasena</h4>
        <p class="text-secondary mb-0" style="font-size: 0.85rem;">Te enviaremos un enlace a tu correo</p>
      </div>

      <div class="alert alert-success py-2" *ngIf="mensaje">{{ mensaje }}</div>

      <ng-container *ngIf="!mensaje">
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-envelope me-1"></i>Correo</label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="tu@correo.com" />
        </div>

        <div class="alert alert-danger py-1" *ngIf="error">{{ error }}</div>

        <button class="btn btn-primary w-100" (click)="enviar()" [disabled]="cargando">
          <i class="bi bi-send me-1"></i>{{ cargando ? 'Enviando...' : 'Enviar enlace de recuperacion' }}
        </button>
      </ng-container>

      <p class="text-center mt-3 mb-0" style="font-size: 0.9rem;">
        <a routerLink="/login" class="text-gradient" style="cursor: pointer; text-decoration: none; font-weight: 600;">Volver a iniciar sesion</a>
      </p>
    </div>
  </div>
</div>
