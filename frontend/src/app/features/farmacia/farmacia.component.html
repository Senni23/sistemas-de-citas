<h3 class="mb-4 text-gradient">Farmacia - Inventario</h3>

<div class="row">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h5>{{ editando ? 'Editar' : 'Nuevo' }} producto</h5>
        <div class="mb-2">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="formulario.nombre" name="nombre" />
        </div>
        <div class="mb-2">
          <label class="form-label">Descripcion</label>
          <input class="form-control" [(ngModel)]="formulario.descripcion" name="descripcion" />
        </div>
        <div class="row">
          <div class="col-6 mb-2">
            <label class="form-label">Stock actual</label>
            <input type="number" min="0" class="form-control" [(ngModel)]="formulario.stock" name="stock" />
          </div>
          <div class="col-6 mb-2">
            <label class="form-label">Stock minimo</label>
            <input type="number" min="0" class="form-control" [(ngModel)]="formulario.stockMinimo" name="stockMinimo" />
          </div>
        </div>
        <div class="row">
          <div class="col-6 mb-2">
            <label class="form-label">Unidad de medida</label>
            <input class="form-control" [(ngModel)]="formulario.unidadMedida" name="unidadMedida" placeholder="caja, unidad..." />
          </div>
          <div class="col-6 mb-2">
            <label class="form-label">Precio unitario (S/)</label>
            <input type="number" min="0" step="0.01" class="form-control" [(ngModel)]="formulario.precioUnitario" name="precioUnitario" />
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label">Fecha de vencimiento</label>
          <input type="date" class="form-control" [(ngModel)]="formulario.fechaVencimiento" name="fechaVencimiento" />
        </div>
        <button class="btn btn-primary me-2" (click)="guardar()">Guardar</button>
        <button class="btn btn-secondary" (click)="cancelar()" *ngIf="editando">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="col-md-8">
    <table class="table table-striped bg-white">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Stock</th>
          <th>Unidad</th>
          <th>Precio</th>
          <th>Vencimiento</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of productos">
          <td>{{ p.nombre }}</td>
          <td>
            {{ p.stock }}
            <span class="badge text-danger ms-1" *ngIf="stockBajo(p)"><i class="bi bi-exclamation-triangle me-1"></i>Stock bajo</span>
          </td>
          <td>{{ p.unidadMedida }}</td>
          <td>S/ {{ p.precioUnitario | number: '1.2-2' }}</td>
          <td>{{ p.fechaVencimiento || '-' }}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" (click)="editar(p)">Editar</button>
            <button class="btn btn-sm btn-outline-danger" (click)="eliminar(p.id!)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
