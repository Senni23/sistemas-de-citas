spring.application.name=citas-backend
server.port=8080

# En desarrollo local carga automaticamente application-local.properties (ignorado por git,
# ahi va tu password real de MySQL). En otros entornos, define las variables DB_PASSWORD y
# JWT_SECRET en vez de crear ese archivo.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Ajusta el usuario segun tu instalacion local de MySQL (Workbench/servicio en el puerto 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/citas_medicas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seguridad: clave para firmar los JWT y tiempo de expiracion (24h). NUNCA pongas la clave
# real aqui; usa application-local.properties o la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:solo-para-arrancar-en-frio-cambia-esto-application-local-properties}
app.jwt.expiration-ms=86400000

# Origen permitido para CORS (el frontend Angular en desarrollo)
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
