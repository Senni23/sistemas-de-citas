spring.application.name=citas-backend
# Render (y otros hosts en la nube) asignan el puerto por la variable PORT.
server.port=${PORT:8080}

# En desarrollo local carga automaticamente application-local.properties (ignorado por git,
# ahi va tu password real de MySQL). En otros entornos, define las variables DB_PASSWORD y
# JWT_SECRET en vez de crear ese archivo.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Ajusta el usuario segun tu instalacion local de MySQL (Workbench/servicio en el puerto 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/citas_medicas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seguridad: clave para firmar los JWT y tiempo de expiracion (24h). NUNCA pongas la clave
# real aqui; usa application-local.properties o la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:solo-para-arrancar-en-frio-cambia-esto-application-local-properties}
app.jwt.expiration-ms=86400000

# Origenes permitidos para CORS, separados por coma (el frontend Angular en desarrollo
# y, en la nube, la URL real del frontend desplegado).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# URL publica del frontend, usada para armar el enlace del correo de recuperacion de
# contrasena. En Render, sobreescribela con la URL real del sitio (variable APP_FRONTEND_URL).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# Envio de correo (recuperacion de contrasena) via Gmail SMTP. MAIL_USERNAME es la cuenta
# de Gmail que envia los correos y MAIL_APP_PASSWORD es una "Contrasena de aplicacion"
# generada en https://myaccount.google.com/apppasswords (NO la contrasena normal de Gmail).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
