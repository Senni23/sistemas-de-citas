# Perfil usado solo por las pruebas de integracion: base de datos H2 en memoria (no toca MySQL).
spring.datasource.url=jdbc:h2:mem:citas_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=secreto-de-pruebas-de-integracion-con-mas-de-32-bytes-0001
app.cors.allowed-origins=http://localhost:4200
